<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | SecondHand Haven</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- simple header with link back to home -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center border-b border-gray-200 bg-white">
    <a href="/" class="text-2xl font-bold text-blue-800">♻️ SecondHand<span class="text-green-600">Haven</span></a>
    <a href="/" class="text-sm text-gray-500 hover:text-blue-700">← Back to home</a>
  </div>

  <div class="flex items-center justify-center min-h-[80vh] px-4 py-12">
    <div class="bg-white rounded-2xl shadow-md w-full max-w-md p-6 border border-gray-100">
      <h1 class="text-2xl font-bold text-center text-gray-800">Welcome back</h1>
      <p class="text-center text-gray-500 text-sm mt-1">Log in to your SecondHand account</p>

      <!-- flash messages (for errors/success) -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mt-4 p-3 rounded-lg text-sm {% if category == 'danger' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/login" method="POST" class="mt-6 space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Email address</label>
          <input type="email" name="email" required
                 class="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" name="password" required
                 class="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-blue-500 focus:border-blue-500 outline-none">
        </div>

        <!-- Submit button -->
        <button type="submit"
                class="w-full bg-blue-800 text-white font-semibold py-2.5 rounded-lg hover:bg-green-700 transition shadow-sm">
          Log in
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account? <a href="/register" class="text-blue-600 hover:underline">Sign up</a>
      </p>
    </div>
  </div>
</body>
</html>
